<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Línea de tiempo — Boletín Minero San Juan</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--txt:#e6e8ec;--muted:#9aa3b2;--accent:#F3C323}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0}
  header h1 b{color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer;text-decoration:none}
  .btn:hover{color:var(--accent)}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .toolbar label{font-size:11px;color:var(--muted);margin-right:4px}
  .toolbar select,.toolbar input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:5px 8px;border-radius:7px;font-size:12px}
  .toolbar input[type=text]{min-width:230px}
  .cnt{font-size:11px;color:var(--muted);margin-left:auto}
  #wrap{display:flex;height:calc(100% - 92px)}
  #side{width:320px;min-width:320px;overflow:auto;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  #list{flex:1;overflow:auto}
  .it{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
  .it:hover{background:var(--panel2)}
  .it.on{background:#20304a}
  .it .e{font-weight:600}
  .it .s{color:var(--muted);font-size:11px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #main{flex:1;overflow:auto;padding:16px 18px}
  .intro{color:var(--muted);font-size:12.5px;line-height:1.6;max-width:760px;margin-bottom:16px}
  .intro b{color:var(--txt)}
  .empty{color:var(--muted);padding:40px;text-align:center}
  .prop{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .prop .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .prop .h .exp{font-weight:600}
  .prop .h .ti{color:var(--muted);font-size:12px}
  .prop .h .rm{margin-left:auto;color:var(--muted);font-size:11px;cursor:pointer}
  .prop .h .rm:hover{color:#e0533b}
  .dur{font-size:12px;color:var(--accent);margin:2px 0 12px}
  .dur span{color:var(--muted)}
  /* timeline */
  .tl{position:relative;height:54px;margin:6px 0 2px}
  .tl .axis{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line)}
  .tl .yr{position:absolute;top:40px;transform:translateX(-50%);font-size:10px;color:var(--muted)}
  .tl .seg{position:absolute;top:33px;height:4px;border-radius:2px;background:#3a4152}
  .tl .mk{position:absolute;top:26px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--bg);cursor:default}
  .tl .lb{position:absolute;top:2px;transform:translateX(-50%);font-size:9.5px;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .leg{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1><b>Línea de tiempo</b> · trámite de las propiedades</h1>
  <a class="btn" href="visor.html">Visor</a>
  <a class="btn" href="sociedades.html">Distribución</a>
  <a class="btn" href="historico.html">Análisis</a>
</header>
<div class="toolbar">
  <span><label>Año</label><select id="anio"></select></span>
  <span><label>Buscar</label><input id="q" type="text" placeholder="sociedad, expediente o mina…" autocomplete="off"/></span>
  <span><label><input type="checkbox" id="soloMen"/> solo con mensura inscripta</label></span>
  <span><label><input type="checkbox" id="ajustar" checked/> encuadrar en los eventos</label></span>
  <span class="cnt" id="cnt"></span>
</div>
<div id="wrap">
  <div id="side"><div id="list"></div></div>
  <div id="main"></div>
</div>
<script>
const COLORS={inicio:'#9aa3b2', cateo_exploracion:'#378ADD', manifestacion_descubrimiento:'#1D9E75', edicto_mensura:'#F3C323',
  registro_mina:'#7F77DD', servidumbre:'#5DCAA5', transferencia:'#D4537E', caducidad:'#D85A30', otro:'#888780',
  insc:'#9b8cff', resmen:'#e0a030', inscmen:'#F28C1E'};
let MODELO=null, ITEMS=[], SEL=[];
const $=id=>document.getElementById(id);
function deb(s){return (s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();}
function yr(f){return f?f.slice(0,4):'';}

async function load(){
  for(const p of ['out_hist/modelo.json','modelo.json']){
    try{const r=await fetch(p); if(r.ok){MODELO=await r.json(); break;}}catch(e){}
  }
  if(!MODELO){ $('main').innerHTML='<div class="empty">No pude cargar modelo.json (serví por HTTP).</div>'; return; }
  // solo expedientes con al menos 2 hitos con fecha
  ITEMS=MODELO.expedientes.filter(e=>hitos(e).length>=2);
  ITEMS.sort((a,b)=>(titu(b)?1:0)-(titu(a)?1:0));
  // años disponibles (de cualquier hito)
  const ys=new Set(); ITEMS.forEach(e=>hitos(e).forEach(h=>{const y=yr(h.f); if(y) ys.add(y);}));
  $('anio').innerHTML='<option value="todos">Todos</option>'+[...ys].sort().reverse().map(y=>`<option>${y}</option>`).join('');
  $('q').oninput=renderList; $('anio').onchange=renderList; $('soloMen').onchange=renderList;
  $('ajustar').onchange=renderMain;
  renderList();
  intro();
}
function titu(e){ const c=e.catastro||{}; return c.titular||e.titular_actual||''; }
function mina(e){ const c=e.catastro||{}; return c.denominacion||e.mina||''; }
// AÑO DE INICIO del trámite = el que viene en el número de expediente (último grupo
// de 2 o 4 dígitos). Es el origen real del expediente.
function expYear(e){
  const mm=(e.expediente||'').match(/(\d{4}|\d{2})(?!\d)/g);
  if(!mm) return null; const y=mm[mm.length-1];
  if(y.length===4){ const n=+y; return (n>=1880&&n<=2026)?n:null; }
  const d=+y; return d<=26?2000+d:1900+d;
}
// hitos ordenados. Se PRIORIZA el boletín (mismo enfoque que el visor): el origen es
// el año del expediente y los eventos son los edictos escrapeados. Las fechas del
// catastro (inscripción / mensura) se muestran como dato secundario.
function hitos(e){
  const c=e.catastro||{}; const out=[]; const ey=expYear(e);
  if(ey) out.push({f:ey+'-01-01', lbl:'Inicio del expediente', tipo:'inicio', src:'exp'});
  (e.eventos||[]).forEach(ev=>(ev.fechas||[]).forEach(f=>{ if(f) out.push({f:f.slice(0,10), lbl:ev.tipo_label||ev.tipo, tipo:ev.tipo, src:'boletin'}); }));
  if(c.fechaInscripcion) out.push({f:c.fechaInscripcion.slice(0,10), lbl:'Inscripción catastro', tipo:'insc', src:'cat'});
  if(c.fechaResolucionMensura) out.push({f:c.fechaResolucionMensura.slice(0,10), lbl:'Resolución mensura', tipo:'resmen', src:'cat'});
  if(c.fechaInscripcionMensura) out.push({f:c.fechaInscripcionMensura.slice(0,10), lbl:'Mensura inscripta', tipo:'inscmen', src:'cat'});
  const seen=new Set(), uniq=[];
  out.sort((a,b)=>a.f.localeCompare(b.f)).forEach(h=>{const k=h.f+h.tipo; if(!seen.has(k)){seen.add(k);uniq.push(h);}});
  return uniq;
}
function intro(){
  $('main').innerHTML=`<div class="intro"><b>Línea de tiempo del trámite (foco: boletín).</b>
   Elegí una o varias propiedades de la izquierda. El <b>origen</b> es el año que trae el
   número de expediente, y los hitos son los <b>edictos escrapeados del boletín</b> (cateo,
   manifestación, mensura) — las mismas fechas que ves en el visor. Se ve cuánto tarda cada
   expediente en aparecer y avanzar en el boletín. La inscripción del catastro se muestra
   como dato secundario.
   <br><br><span style="color:#6b7280">Se listan ${ITEMS.length} propiedades escrapeadas.</span></div>`;
}
function renderList(){
  const v=deb($('q').value), anio=$('anio').value, soloMen=$('soloMen').checked;
  const res=ITEMS.filter(e=>{
    if(soloMen && !(e.catastro||{}).fechaInscripcionMensura) return false;
    if(anio!=='todos' && !hitos(e).some(h=>yr(h.f)===anio)) return false;
    if(v && !deb([e.expediente,titu(e),mina(e)].join(' ')).includes(v)) return false;
    return true;
  });
  $('cnt').textContent=res.length+' propiedades'+(SEL.length?' · '+SEL.length+' seleccionadas':'');
  $('list').innerHTML=res.slice(0,400).map(e=>{const i=MODELO.expedientes.indexOf(e);
    return `<div class="it${SEL.includes(i)?' on':''}" data-i="${i}">
      <div class="e">${e.expediente||'(s/exp)'} ${mina(e)?'· '+mina(e):''}</div>
      <div class="s">${titu(e)||'—'} · ${hitos(e).length} hitos</div></div>`;}).join('')
    || '<div class="empty" style="padding:20px">Sin resultados</div>';
  $('list').querySelectorAll('.it').forEach(el=>el.onclick=()=>toggle(+el.dataset.i));
}
function toggle(i){ const k=SEL.indexOf(i); if(k>=0) SEL.splice(k,1); else SEL.push(i); renderList(); renderMain(); }
function fmtDur(d1,d2){
  const a=new Date(d1), b=new Date(d2); const dias=(b-a)/86400000;
  const años=dias/365.25;
  if(años>=1) return años.toFixed(1).replace('.',',')+' años';
  return Math.round(dias)+' días';
}
function renderMain(){
  if(!SEL.length){ intro(); return; }
  const encuadrar = $('ajustar') ? $('ajustar').checked : true;
  let html='';
  SEL.forEach(i=>{
    const e=MODELO.expedientes[i]; const h=hitos(e);
    const inicio=h.find(x=>x.tipo==='inicio');
    const bol=h.filter(x=>x.src==='boletin');
    const inscmen=h.find(x=>x.tipo==='inscmen');
    // EJE POR PROPIEDAD: se concentra en sus propios hitos. Si 'encuadrar', el eje se
    // calcula solo con los eventos (sin el inicio viejo del expediente), y el inicio no
    // se dibuja en la línea (queda en el texto de arriba) — así los años recientes se ven.
    const ejeH = encuadrar ? h.filter(x=>x.tipo!=='inicio') : h;
    const base = ejeH.length ? ejeH : h;
    let y0=+yr(base[0].f), y1=+yr(base[base.length-1].f);
    if(y1<=y0) y1=y0+1;
    const t0=new Date(y0+'-01-01'), t1=new Date((y1+1)+'-01-01');
    const pos=f=>{ const t=(new Date(f)-t0)/(t1-t0); return (Math.max(0,Math.min(1,t))*100).toFixed(2); };
    const draw = encuadrar ? h.filter(x=>x.tipo!=='inicio') : h;
    const prim=draw[0], ult=draw[draw.length-1];
    const nY=y1-y0+1; const yrs=[]; for(let y=y0;y<=y1;y++) yrs.push(y);
    let dur='';
    if(inicio){
      dur=`Iniciado <b>~${yr(inicio.f)}</b> <span>(nº de expediente)</span>`;
      if(bol.length) dur+=` · en el boletín desde <b>${yr(bol[0].f)}</b> <span>(${fmtDur(inicio.f,bol[0].f)} después)</span> · ${bol.length} edicto${bol.length>1?'s':''}`;
      else dur+=` · <span>sin edictos en el boletín (2020-2026)</span>`;
      if(inscmen) dur+=` · mensura inscripta <b>${yr(inscmen.f)}</b>`;
    } else {
      dur=`Trámite visible: <b>${fmtDur(prim.f,ult.f)}</b> <span>(${yr(prim.f)} → ${yr(ult.f)})</span>`;
    }
    html+=`<div class="prop">
      <div class="h"><span class="exp">${e.expediente||'(s/exp)'}</span>
        <span class="ti">${mina(e)?mina(e)+' · ':''}${titu(e)||''}</span>
        <span class="rm" data-i="${i}">✕ quitar</span></div>
      <div class="dur">${dur}</div>
      <div class="tl">
        <div class="axis"></div>
        <div class="seg" style="left:${pos(prim.f)}%;width:${Math.max(0.5,pos(ult.f)-pos(prim.f))}%"></div>
        ${yrs.filter((y,idx)=>nY<=12||idx%Math.ceil(nY/12)===0).map(y=>`<div class="yr" style="left:${pos(y+'-07-01')}%">${y}</div>`).join('')}
        ${draw.map((x,idx)=>`<div class="mk" style="left:${pos(x.f)}%;background:${COLORS[x.tipo]||'#888'}" title="${x.f} · ${x.lbl}"></div>
           <div class="lb" style="left:${pos(x.f)}%;top:${idx%2?13:1}px">${x.lbl.length>16?x.lbl.slice(0,15)+'…':x.lbl}</div>`).join('')}
      </div>
    </div>`;
  });
  html+=`<div class="leg">
    <span><i style="background:#9aa3b2"></i>Inicio del expediente</span>
    <span><i style="background:#378ADD"></i>Cateo (boletín)</span>
    <span><i style="background:#1D9E75"></i>Manifestación (boletín)</span>
    <span><i style="background:#F3C323"></i>Mensura (boletín)</span>
    <span style="opacity:.7"><i style="background:#F28C1E"></i>Mensura inscripta (catastro)</span></div>`;
  $('main').innerHTML=html;
  $('main').querySelectorAll('.rm').forEach(el=>el.onclick=()=>toggle(+el.dataset.i));
}
load();
</script>
</body>
</html>
