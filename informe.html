<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Informe de Inteligencia Minera — San Juan</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--txt:#e6e8ec;--muted:#9aa3b2;--accent:#F3C323;
        --vig:#1D9E75;--cad:#e0533b;--vac:#888780;--op:#34d399;--warn:#f59e0b;--pipe:#c98a1a;--blk:#8b5cf6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;font-weight:600;margin:0}header h1 b{color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer;text-decoration:none}
  .btn:hover{color:var(--accent)}
  .btn.on{color:var(--accent);border-color:var(--accent)}
  main{max-width:960px;margin:0 auto;padding:22px 20px 90px}
  h2{font-size:20px;margin:40px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
  h2 .n{color:var(--accent);font-size:13px;font-weight:600;margin-right:6px}
  h3{font-size:14px;color:var(--txt);margin:20px 0 8px}
  p{line-height:1.65;color:#c7ccd6;font-size:14px}
  .lead{font-size:15px;color:var(--txt)}
  b{color:var(--txt)}
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
  .kpi{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .v{font-size:25px;font-weight:700}
  .kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
  .bar{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12.5px}
  .bar .nm{width:160px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .t{flex:1;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar .t i{display:block;height:100%;border-radius:4px}
  .bar .v{width:86px;text-align:right;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
  .insight{background:#1a2230;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0;font-size:13.5px;line-height:1.6}
  .insight b{color:var(--accent)}
  .warn{background:#241a10;border-left:3px solid var(--warn)}
  .warn b{color:var(--warn)}
  .muted{color:var(--muted);font-size:12px}
  a.src{color:var(--accent);text-decoration:none}
  tr.cart:hover td{background:var(--panel2)}
  tr.cart .tri{display:inline-block;transition:transform .15s;color:var(--accent)}
  tr.cart.open .tri{transform:rotate(90deg)}
  table.sub{margin:0;background:var(--bg);border-radius:8px}
  table.sub th{font-size:10px}
  table.sub td,table.sub th{padding:4px 8px;border-bottom:1px solid var(--panel2)}
  .cbu{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.02em;color:var(--txt);word-break:break-all}
  .cbucard{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .cbucard .cc{font-size:11px;color:var(--muted)}
  .cbucard .copy{align-self:flex-start;margin-top:3px;font-size:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 7px;cursor:pointer}
  .cbucard .copy:hover{color:var(--accent)}
  .tramite{display:block;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;text-decoration:none;color:var(--txt)}
  .tramite:hover{border-color:var(--accent)}
  .tramite .tn{color:var(--accent);font-weight:600;font-size:13px}
  .tramite .td{font-size:12px;color:var(--muted);margin-top:2px}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
  /* timeline de vacancia */
  .tl{position:relative;margin:16px 0 8px;padding-left:6px}
  .tl .row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding:9px 0;border-left:2px solid var(--line);margin-left:8px;padding-left:16px;position:relative}
  .tl .row::before{content:"";position:absolute;left:-7px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--panel2);border:2px solid var(--muted)}
  .tl .row.fatal::before{background:var(--cad);border-color:var(--cad)}
  .tl .dia{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--accent);padding-top:1px}
  .tl .desc{font-size:13px;color:var(--txt);line-height:1.45}
  .tl .norma{font-size:11px;color:var(--muted);margin-top:2px}
  .tl .cons{font-size:11.5px;color:#b9c0cc;margin-top:3px;font-style:italic}
  .fatalpill{background:#3a1d17;color:#f0a08c;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:6px;font-weight:700;vertical-align:middle}
  .camino{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;background:var(--panel)}
  .camino .h{font-weight:600;color:var(--accent);font-size:13.5px}
  .camino .n{font-size:11px;color:var(--muted);margin-top:2px}
  .camino p{margin:6px 0 0;font-size:13px}
  #mapa,#mapaPed{height:440px;border-radius:12px;border:1px solid var(--line);margin:10px 0}
  #mapaPed{height:380px}
  .leaflet-popup-content{font-size:12.5px;color:#111}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 2px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .exig{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
  @media(max-width:720px){.exig{grid-template-columns:repeat(2,1fr)}}
  .exig .b{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}
  .exig .b .lv{font-size:11px;font-weight:700;letter-spacing:.04em}
  .exig .b .c{font-size:23px;font-weight:700;margin:4px 0 0}
  .exig .b .s{font-size:11px;color:var(--muted)}
  .play{counter-reset:p;padding-left:0}
  .play li{list-style:none;position:relative;padding:10px 0 10px 40px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55;color:#c7ccd6}
  .play li::before{counter-increment:p;content:counter(p);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .play li b{color:var(--txt)}
</style>
</head>
<body>
<header>
  <h1><b>Informe</b> · Inteligencia Minera San Juan</h1>
  <a class="btn" href="visor.html">Visor</a>
  <a class="btn" href="sociedades.html">Distribución</a>
  <a class="btn" href="historico.html">Análisis</a>
  <a class="btn" href="linea.html">Línea de tiempo</a>
  <a class="btn" href="vencimientos.html">Vencimientos</a>
  <a class="btn on" href="informe.html">Informe</a>
  <a class="btn" href="cateo.html">Cateo</a>
</header>
<main id="main"><p class="muted">Cargando datos…</p></main>
<script>
const fmt=n=>Math.round(n||0).toLocaleString('es-AR');
const money=n=>'$'+fmt(n);
async function j(p){ for(const u of [p, p.replace('out_hist/','')]){ try{const r=await fetch(u); if(r.ok) return await r.json();}catch(e){} } return null; }
function barList(rows,color,unit){
  const max=rows.length?Math.max(...rows.map(r=>r[1])):1;
  return rows.map(([n,v])=>`<div class="bar"><span class="nm" title="${n}">${n}</span>
    <span class="t"><i style="width:${Math.max(3,v/max*100)}%;background:${color}"></i></span>
    <span class="v">${fmt(v)}${unit||''}</span></div>`).join('');
}
(async()=>{
  const D=await j('out_hist/sim/informe_avanzado.json');
  if(!D){ document.getElementById('main').innerHTML='<p>No pude cargar <code>out_hist/sim/informe_avanzado.json</code>. Corré <code>python -m bsj.informe ./out_hist</code>.</p>'; return; }
  const REF=await j('legal/referencia_minera_sj.json');
  const T=D.totales, X=D.exigibilidad, DIS=D.disponibilidad, C=D.caducidad, CO=D.concesionarios, ML=D.marco_legal;
  const est=T.por_estado;
  const canonJuego=T.canon_anual_caduca;
  const lvl=(k)=>X[k]||{minas:0,ha:0};

  const html=`
  <p class="lead">Informe de inteligencia que fusiona las <b>tres fuentes</b> del proyecto —
  Boletín Oficial, Catastro Minero (GeoServer) y el <b>Padrón del SIM Producción</b>— con el
  <b>motor legal</b> del asesor minero (Cód. de Minería nacional Ley 1919 + Cód. Procesal Minero de
  San Juan, Ley 688-M). No describe estados: los traduce a <b>exigibilidad jurídica</b> — qué se puede
  pedir, cuándo y bajo qué artículo.
  <span class="muted">Generado ${new Date(D.generado).toLocaleDateString('es-AR')} · ${fmt(T.expedientes)} expedientes deduplicados de ${fmt(T.registros_crudos)} tramos del SIM.</span></p>

  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(T.expedientes)}</div><div class="l">expedientes en el padrón</div></div>
    <div class="kpi"><div class="v" style="color:var(--cad)">${fmt(est['Caduca']||0)}</div><div class="l">minas caducas (pipeline)</div></div>
    <div class="kpi"><div class="v" style="color:var(--cad)">${fmt(T.ha_caduca)} ha</div><div class="l">superficie en caducidad</div></div>
    <div class="kpi"><div class="v" style="color:var(--accent)">${money(canonJuego)}</div><div class="l">canon anual en juego (caducas)</div></div>
  </div>

  <div class="insight warn"><b>Advertencia metodológica.</b> El SIM devuelve <b>tramos</b> de estado, no minas:
  ${fmt(T.registros_crudos)} registros son ${fmt(T.expedientes)} expedientes. Deduplicando por el tramo abierto
  más reciente, los estados reales son <b>${fmt(est['Vigente']||0)} vigentes / ${fmt(est['Caduca']||0)} caducas /
  ${fmt(est['Vacante No Disponible']||0)} vacantes</b> — no los 2.131/690/77 que da el conteo crudo. Todo este informe usa los números deduplicados.</div>

  <h2><span class="n">1</span>Estado ≠ exigibilidad: qué se puede pedir HOY</h2>
  <p>El estado administrativo del padrón (“Caduca”, “Vacante”) <b>no</b> equivale a que el terreno esté
  disponible para un tercero. La caducidad por canon (art. 216 CM) abre un <b>circuito de vacancia</b>
  —rescate, inscripción, publicación, plazos— que la Dirección de Minería tiene que recorrer antes de
  que la mina sea <i>pedible</i>. Clasificando cada derecho por exigibilidad:</p>
  <div class="exig">
    <div class="b"><div class="lv" style="color:var(--op)">DISPONIBLE</div><div class="c" style="color:var(--op)">${fmt(lvl('DISPONIBLE').minas)}</div><div class="s">${fmt(lvl('DISPONIBLE').ha)} ha · pedible hoy</div></div>
    <div class="b"><div class="lv" style="color:var(--pipe)">PIPELINE</div><div class="c" style="color:var(--pipe)">${fmt(lvl('PIPELINE').minas)}</div><div class="s">${fmt(lvl('PIPELINE').ha)} ha · caduca, aún no</div></div>
    <div class="b"><div class="lv" style="color:var(--blk)">BLOQUEADO</div><div class="c" style="color:var(--blk)">${fmt(lvl('BLOQUEADO').minas)}</div><div class="s">${fmt(lvl('BLOQUEADO').ha)} ha · vacante reciente/IPEEM</div></div>
    <div class="b"><div class="lv" style="color:var(--vig)">VIGENTE</div><div class="c" style="color:var(--vig)">${fmt(lvl('VIGENTE').minas)}</div><div class="s">${fmt(lvl('VIGENTE').ha)} ha · de terceros</div></div>
  </div>
  <div class="insight">El titular apurado que ve “690 caducas” y cree que hay 690 minas para pedir se equivoca dos veces:
  son <b>${fmt(est['Caduca']||0)}</b> (no 690, por los tramos), y de ésas <b>${fmt(lvl('PIPELINE').minas)} NO son pedibles</b> —el
  circuito de vacancia está detenido. Legalmente pedibles hoy: <b>sólo ${fmt(DIS.pedibles_hoy)}</b> (art. 220 CM, registros
  anulados por 3 años de vacancia). El valor no está en pedir: está en <b>ver el pipeline 12-18 meses antes</b> que quien lee el boletín.</div>

  <h2><span class="n">2</span>El circuito de la vacancia (marco legal)</h2>
  <p>Desde que una mina cae por falta de pago del canon, la ley marca una secuencia de hitos. Éste es el
  cronograma que arma el motor legal (<code>cronograma_vacancia</code>), tomado como plantilla —el reloj
  real arranca con la <b>notificación</b> al titular, dato que el SIM no publica:</p>
  <div class="tl">
    ${ML.vacancia.map(h=>`<div class="row ${h.fatal?'fatal':''}">
      <div class="dia">+${h.dia} d</div>
      <div><div class="desc">${h.desc}${h.fatal?'<span class="fatalpill">FATAL</span>':''}</div>
        <div class="norma">${h.norma}</div>
        ${h.consecuencia?`<div class="cons">${h.consecuencia}</div>`:''}</div></div>`).join('')}
  </div>
  <div class="insight">Dos plazos son <b>ventanas de oportunidad</b> que casi nadie mira: entre el día ~93
  (queda DISPONIBLE, art. 90) y el día ~310 corre la <b>preferencia del IPEEM</b>; recién después el privado
  entra en igualdad. Y la <b>veda al ex-titular</b> (no puede repedir su propia mina) es la palanca para
  quien quiere quedarse con un área que un competidor dejó caer.</div>

  <h2><span class="n">3</span>Mapa de vencimiento</h2>
  <p>Las <b>${fmt(D.caducas_geo.length)}</b> minas caducas dibujadas con su <b>polígono real</b> (catastro,
  POSGAR 2007). El color va con la antigüedad de la caducidad — más rojo = hace más tiempo, más cerca de la
  anulación del art. 220. Clic en cada parcela para ver expediente, titular, canon y fecha.</p>
  <div id="mapa"></div>
  <div class="legend">
    <span><i style="background:#fde68a"></i>caducó hace poco (&lt;6m)</span>
    <span><i style="background:#f59e0b"></i>6-12 meses</span>
    <span><i style="background:#e0533b"></i>1-2 años</span>
    <span><i style="background:#7f1d1d"></i>+2 años (cerca de art. 220)</span>
  </div>

  <h2><span class="n">3b</span>Las ${fmt(D.pedibles_geo.length)} minas pedibles HOY</h2>
  <p>De las ${fmt(est['Caduca']||0)} caducas, el circuito de vacancia sólo está <b>completo</b> en
  <b>${fmt(D.pedibles_geo.length)} expedientes</b>: registros empadronados como vacantes por <b>más de 3 años</b>,
  cuyo asiento se anula de pleno derecho y el terreno queda franco (<b>art. 220 CM</b>). Son las únicas
  legalmente disponibles para pedir en este momento. Éstas son, con su polígono:</p>
  <div id="mapaPed"></div>
  <div class="card"><table>
    <tr><th>Mina</th><th>Depto</th><th class="n">ha</th><th class="n">Años vacante</th><th>Titular anterior</th></tr>
    ${D.pedibles_geo.slice().sort((a,b)=>(b.dias_vacante||0)-(a.dias_vacante||0)).map(p=>`<tr>
      <td title="${p.expediente}">${p.nombre||p.expediente}</td>
      <td>${p.departamento||'—'}</td>
      <td class="n">${p.ha?fmt(p.ha):'s/d'}</td>
      <td class="n">${p.dias_vacante?(p.dias_vacante/365).toFixed(1):'—'}</td>
      <td class="muted">${p.titular||'—'}</td></tr>`).join('')}
  </table>
  <p class="muted">“ha s/d” = el catastro no tiene polígono para ese expediente (registros muy antiguos);
  igual son pedibles. La antigüedad se cuenta desde la inscripción de vacancia.</p></div>
  <div class="insight">Ojo con el <b>art. 220</b>: la anulación incorpora el terreno <i>de pleno derecho y
  sin cargo a los permisos de exploración vigentes que lo cubran</i>. Antes de pedir, verificar en el visor
  si un cateo activo ya se superpone: en ese caso el área cae dentro de ese permiso, no queda libre para un tercero.</div>

  <h2><span class="n">4</span>Dónde y qué se libera</h2>
  <div class="grid2">
    <div class="card"><h3>Cuándo caducaron</h3>
      ${barList(Object.entries(C.por_anio).sort().map(([y,v])=>[y,v.ha]),'var(--cad)',' ha')}
      <p class="muted">${Object.entries(C.por_anio).sort().map(([y,v])=>`${y}: ${v.n} minas · ${money(v.canon)}`).join(' · ')}</p></div>
    <div class="card"><h3>Dónde (ha por departamento)</h3>
      ${barList(Object.entries(C.por_depto).map(([d,v])=>[d,v.ha]).slice(0,7),'var(--cad)',' ha')}</div>
  </div>
  <div class="card"><h3>Qué mineral (nº de minas caducas)</h3>${barList(Object.entries(C.por_mineral),'#c98a1a','')}</div>
  <div class="insight"><b>Calingasta e Iglesia concentran el ${Math.round((C.por_depto['Calingasta'].ha+ (C.por_depto['Iglesia']?.ha||0))/T.ha_caduca*100)}%</b>
  de la superficie que cae, sobre pórfidos de <b>oro y cobre</b> (los tres minerales más frecuentes en el pipeline).
  El <b>${Math.round(C.por_anio['2025'].n/(est['Caduca'])*100)}%</b> de las caducidades ocurrió en 2025 — una ola concentrada, no un goteo histórico.</div>

  <h2><span class="n">5</span>Concentración de titulares (por CUIT)</h2>
  <p>Unificando por CUIT/DNI —dato que sólo trae el SIM— hay <b>${fmt(CO.n)} concesionarios</b> distintos.
  La foto de tenencia y la de riesgo no coinciden: quien más superficie tiene no es siempre quien más deja caer.</p>
  <div class="grid2">
    <div class="card"><h3>Top por superficie (ha)</h3>
      <table><tr><th>Concesionario</th><th class="n">Minas</th><th class="n">ha</th><th class="n">Caduca</th></tr>
      ${CO.top_ha.slice(0,8).map(h=>`<tr><td title="CUIT ${h.cuit}">${h.nombre}</td><td class="n">${h.minas}</td><td class="n">${fmt(h.ha)}</td><td class="n" style="color:${h.caduca?'var(--cad)':'var(--muted)'}">${h.caduca}</td></tr>`).join('')}
      </table></div>
    <div class="card"><h3>Quién deja caer más (pipeline)</h3>
      ${barList(C.concentracion.slice(0,8).map(h=>[h.nombre,h.minas]),'var(--cad)',' minas')}</div>
  </div>
  <div class="insight"><b>El propio Estado es el mayor moroso.</b> El <b>IPEEM</b> es a la vez el mayor
  tenedor (${fmt(CO.top_ha[0].minas)} minas, ${fmt(CO.top_ha[0].ha)} ha) y el que más derechos deja caer
  (${C.concentracion[0].minas} en el pipeline) — y por el art. 29 <i>in fine</i> Ley 688-M tiene <b>preferencia
  sobre toda área que se libere</b>. Es el actor a vigilar en cualquier estrategia de adquisición.</div>

  <h2><span class="n">6</span>Los cinco caminos de adquisición</h2>
  ${ML.caminos.map(c=>`<div class="camino"><div class="h">${c.n}</div><div class="n">${c.norma}</div><p>${c.desc}</p></div>`).join('')}

  <h3>En detalle: transferencia / cesión — la vía más rápida</h3>
  <p>La mina es un <b>inmueble</b> (art. 12 CM), se concede <b>por tiempo ilimitado</b> (art. 18) y se
  <b>adquiere y posee como una propiedad raíz</b> (art. 21): puede venderse, cederse, arrendarse, hipotecarse o
  aportarse a una sociedad. La única restricción fuerte es que <b>no se puede dividir materialmente</b>
  (art. 14) — se transfiere la mina entera o cuotas-parte indivisas. No hace falta esperar a que caduque ni
  recorrer el circuito de vacancia: se compra el derecho <b>directamente al titular</b>. Es la única vía que
  <b>no depende del ritmo de la Dirección de Minería</b> —que, como muestra este informe, tiene el circuito de
  vacancia detenido— y la única que <b>esquiva la veda al ex-titular</b>: si dejás caducar y después pedís, el
  anterior concesionario no puede repedir su mina; pero si se la comprás antes, el derecho sigue vivo y sin veda.</p>
  <div class="grid2">
    <div class="card"><h3 style="margin-top:0">Cómo se instrumenta</h3>
      <p style="font-size:13px">1. <b>Contrato de cesión/compraventa</b> por instrumento público (la mina es
      inmueble, art. 12).<br>
      2. <b>Inscripción</b> en el Registro Catastral Minero (art. 20 CM) — recién ahí es oponible a terceros.<br>
      3. Verificar que el <b>canon esté al día</b>: la deuda de canon sigue a la mina; el comprador la hereda.
      Pedir libre deuda antes de firmar.<br>
      4. Chequear <b>servidumbres, hipotecas y co-titularidad</b> en el padrón (la cesión de una cuota indivisa
      requiere acuerdo con el resto: la mina no se divide, art. 14).</p></div>
    <div class="card"><h3 style="margin-top:0">Por qué conviene sobre la vacancia</h3>
      <p style="font-size:13px">· <b>Certeza:</b> el título ya existe y está mensurado; no dependés de que se
      declare la vacancia ni de ganar la puja del art. 90.<br>
      · <b>Sin veda:</b> evitás el art. 90 <i>in fine</i> / 219 <i>in fine</i> CM que traba al ex-titular.<br>
      · <b>Sin preferencia estatal:</b> el IPEEM sólo tiene preferencia sobre lo que <i>se libera</i>; una
      transferencia privada no pasa por esa ventana.<br>
      · <b>Timing:</b> comprás antes de la caída, cuando el titular en apuros de canon todavía puede negociar.</p></div>
  </div>
  <div class="card"><h3>Carteras-objetivo detectadas en el pipeline</h3>
    <p class="muted">Titulares privados con más derechos <b>en caducidad</b> (no el IPEEM, que es estatal): son
    los que más incentivo tienen a vender antes de perderlo todo. Candidatos naturales para acercarse con una
    oferta de cesión. <b>Clic en una fila</b> para ver sobre qué propiedades pesa esa deuda.</p>
    <table><tr><th>Titular</th><th class="n">Minas</th><th class="n">ha</th><th class="n">Canon anual (est.)</th><th class="n">Deuda acum. (est.)</th></tr>
    ${(C.carteras||[]).map((g,i)=>`<tr class="cart" data-i="${i}" style="cursor:pointer">
        <td><span class="tri">▸</span> ${g.nombre}${g.cuit?` <span class="muted">· CUIT ${g.cuit}</span>`:''}</td>
        <td class="n" style="color:var(--cad)">${g.minas}</td><td class="n">${fmt(g.ha)}</td>
        <td class="n">${money(g.canon_anual)}</td><td class="n" style="color:var(--cad)">${money(g.deuda_est)}</td></tr>
      <tr class="det" id="det${i}" hidden><td colspan="5"><table class="sub">
        <tr><th>Expediente</th><th>Mina</th><th>Depto</th><th class="n">ha</th><th class="n">Canon/año</th><th class="n">Años cad.</th><th class="n">Deuda est.</th></tr>
        ${g.props.map(p=>`<tr><td class="muted">${p.expediente||''}</td><td>${p.nombre||'—'}</td><td>${p.departamento||''}</td>
          <td class="n">${p.ha?fmt(p.ha):'s/d'}</td><td class="n">${money(p.canon)}</td><td class="n">${p.anios_caduca}</td>
          <td class="n" style="color:var(--cad)">${money(p.deuda_est)}</td></tr>`).join('')}
      </table></td></tr>`).join('')}
    </table>
    ${(C.carteras_estatal||[]).map(g=>`<p class="muted" style="margin-top:8px">↳ <b style="color:var(--blk)">${g.nombre}</b> (estatal, no vendible):
      ${g.minas} minas · ${fmt(g.ha)} ha · deuda est. <b>${money(g.deuda_est)}</b> — además tiene preferencia sobre lo que se libere.</p>`).join('')}
    <p class="muted" style="margin-top:6px">La deuda es una <b>estimación normativa</b> (canon anual del art. 215 CM × años en caducidad),
    no la deuda liquidada del SIM (que requiere login). Sirve para dimensionar y priorizar, no como monto exacto.</p></div>
  <div class="insight warn"><b>Riesgo a mirar:</b> el canon adeudado viaja con la mina. En una cartera en
  pipeline la deuda acumulada puede acercarse al valor del activo — por eso la due-diligence de <i>libre deuda de
  canon</i> (y de regalías, Ley 716-M) es el paso que define si la transferencia conviene o si es mejor esperar la vacancia.</div>

  <h2><span class="n">7</span>Canon minero</h2>
  <p>El canon se estima con el motor legal (<code>canon_mina</code>, art. 215 CM t.o. Ley 27.701):
  <b>${money(ML.canon_ref['1ra_por_pertenencia'])}</b> por pertenencia (1.ª categoría) / <b>${money(ML.canon_ref['2da'])}</b> (2.ª),
  con multiplicadores por tipo de yacimiento (diseminado ×10, hierro ×3, carbón ×6). Sobre el padrón vigente
  eso son <b>${money(T.canon_anual_vigente)}/año</b> en canon activo; las caducas representan
  <b>${money(T.canon_anual_caduca)}/año</b> de recaudación perdida.</p>
  <div class="insight warn"><b>Deuda y pagos reales:</b> los endpoints del SIM que traen importes y pagos
  (<code>canonMinero/.../importe</code>, <code>historicoCanonMinero/.../obtenerPagados</code>) <b>requieren
  login</b> (devuelven 401/405). El canon de este informe es una <b>estimación normativa</b>, no la deuda
  liquidada. El cliente ya está listo para sumar los importes reales si se consigue una cuenta.</div>

  <h2><span class="n">8</span>Playbook accionable</h2>
  <ol class="play">
    <li><b>Monitorear el pipeline, no el boletín.</b> Las ${fmt(est['Caduca']||0)} caducas del SIM anticipan
      12-18 meses lo que el Boletín publicará como vacante. Alertar sobre cambios de estado da la ventaja de tiempo.</li>
    <li><b>Vigilar al IPEEM.</b> Concentra tenencia, morosidad y preferencia legal. Todo movimiento sobre
      área liberada compite primero contra el Estado (art. 29 <i>in fine</i>).</li>
    <li><b>Comprar antes de la caída.</b> La transferencia (art. 25 CM) sobre una cartera en pipeline evita
      el proceso de vacancia y la veda al ex-titular. Priorizar titulares con muchas caducas (Argentina Minera, Minera del Carmen).</li>
    <li><b>Cronometrar la ventana del art. 90.</b> Para las que sí lleguen a vacancia declarada, el día ~93
      abre la disponibilidad; anticipar la solicitud y controlar la preferencia del IPEEM.</li>
    <li><b>Foco geográfico Calingasta–Iglesia, oro/cobre.</b> Ahí está el ${Math.round((C.por_depto['Calingasta'].ha+(C.por_depto['Iglesia']?.ha||0))/T.ha_caduca*100)}%
      de la superficie que cae, sobre los minerales de mayor valor.</li>
  </ol>

  ${REF?`
  <h2><span class="n">9</span>Aranceles, CBUs y trámites 2026</h2>
  <p>Datos oficiales de la Dirección de Minería para operar: cuánto cuesta un cateo según su superficie,
  a qué cuenta se paga cada concepto y dónde está cada trámite. <a class="src" href="cateo.html">→ Calculadora y armador de cateo</a></p>
  <div class="grid2">
    <div class="card"><h3>Valor de la unidad de medida — cateo (2026)</h3>
      <p class="muted">Cada unidad = ${fmt(REF.unidad_medida_cateo_2026.unidad_ha)} ha. Valor por unidad: <b>${money(REF.unidad_medida_cateo_2026.valor_por_unidad)}</b> (lineal).</p>
      <table><tr><th class="n">#</th><th>Superficie</th><th class="n">Valor 2026</th></tr>
      ${REF.unidad_medida_cateo_2026.tabla.map(r=>`<tr><td class="n">${r.n}</td><td>hasta ${fmt(r.hasta_ha)} ha</td><td class="n">${money(r.valor)}</td></tr>`).join('')}
      </table></div>
    <div class="card"><h3>CBUs de pago (Dirección de Minería)</h3>
      <div style="display:grid;gap:8px">
      ${REF.cbu.map(c=>`<div class="cbucard"><span class="cc">${c.concepto}</span><span class="cbu">${c.cbu}</span>
        <button class="copy" data-cbu="${c.cbu}">copiar CBU</button></div>`).join('')}
      </div>
      <div class="insight warn" style="margin-top:10px"><b>Importante:</b> ${REF.nota_pago}</div></div>
  </div>
  <div class="card"><h3>Trámites oficiales (cada uno con su ficha y PDF)</h3>
    ${REF.tramites.map(t=>`<a class="tramite" href="${t.url}" target="_blank" rel="noopener">
      <span class="tn">${t.nombre}</span><span class="td">${t.desc}</span></a>`).join('')}
    <p class="muted">Fuente: <a class="src" href="https://tramite.sanjuan.gov.ar/index.php/tramite/org/31" target="_blank">portal de trámites de San Juan — Minería</a>.</p></div>
  `:''}

  <h2>Fuentes y método</h2>
  <p class="muted">
  <b>SIM Producción</b> (<a class="src" href="https://simproduccion.sanjuan.gob.ar/expedientes" target="_blank">simproduccion.sanjuan.gob.ar</a>) —
  padrón administrativo vía API pública; se deduplican los tramos por expediente (tramo abierto más reciente).
  <b>Catastro/GeoServer</b> — geometrías oficiales POSGAR 2007; superficie por reproyección a EPSG:5344.
  <b>Boletín Oficial</b> — línea de tiempo de edictos. Cruce por expediente canónico (sólo dígitos) y titulares por CUIT.
  <b>Marco legal:</b> motor de plazos <code>bsj/legal.py</code> sobre Cód. de Minería (Ley 1919) y Cód. Procesal Minero SJ (Ley 688-M).
  El canon es estimación normativa (art. 215 CM), no deuda liquidada.</p>
  `;
  document.getElementById('main').innerHTML=html;

  // desplegable de propiedades por cartera
  document.querySelectorAll('tr.cart').forEach(r=>{
    r.addEventListener('click',()=>{
      const d=document.getElementById('det'+r.dataset.i);
      if(d){ d.hidden=!d.hidden; r.classList.toggle('open',!d.hidden); }
    });
  });
  // copiar CBU
  document.querySelectorAll('.copy').forEach(b=>{
    b.addEventListener('click',async()=>{
      try{ await navigator.clipboard.writeText(b.dataset.cbu); const t=b.textContent; b.textContent='✓ copiado'; setTimeout(()=>b.textContent=t,1200); }catch(e){}
    });
  });

  // ---- mapas (polígonos reales; cen = [lat,lon], pol = [[lon,lat],...]) ----
  const hoy=new Date();
  function colorEdad(fc){ if(!fc) return '#f59e0b';
    const meses=(hoy-new Date(fc))/(1000*3600*24*30.4);
    if(meses<6) return '#fde68a'; if(meses<12) return '#f59e0b'; if(meses<24) return '#e0533b'; return '#7f1d1d';
  }
  function baseTiles(map){ L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {attribution:'© OpenStreetMap © CARTO',maxZoom:18}).addTo(map); }
  function popupHtml(m){ return `<b>${m.nombre||m.expediente}</b><br>Expte ${m.expediente} · ${m.departamento||''}<br>
      ${(m.minerales||[]).join(', ')||'—'}<br>
      <b>${m.ha?fmt(m.ha)+' ha':'sup. s/d'}</b> · ${m.pertenencias} pert. · canon est. <b>${money(m.canon)}</b><br>
      ${m.fecha_caducidad?'Caducó: '+m.fecha_caducidad+'<br>':''}
      ${m.dias_vacante?'Vacante hace <b>'+(m.dias_vacante/365).toFixed(1)+' años</b> (art. 220)<br>':''}
      <span style="color:#555">${m.titular||''}${m.cuit?' · CUIT '+m.cuit:''}</span>`; }
  // un pedimento real no supera ~0.3° (~30 km); más que eso es geometría errónea -> se ignora
  function polSano(p){ if(!p||p.length<3) return null;
    let lo0=180,lo1=-180,la0=90,la1=-90;
    for(const q of p){ if(q[0]<lo0)lo0=q[0]; if(q[0]>lo1)lo1=q[0]; if(q[1]<la0)la0=q[1]; if(q[1]>la1)la1=q[1]; }
    return ((lo1-lo0)>0.3||(la1-la0)>0.3)?null:p; }
  // dibuja un derecho como polígono (si tiene pol) o marcador (fallback); devuelve latlngs para bounds
  function dibujar(map,m,col,opts){
    opts=opts||{};
    const pol=polSano(m.pol);
    if(pol){
      const ll=pol.map(([lon,lat])=>[lat,lon]);
      L.polygon(ll,{color:col,weight:opts.weight||1.5,fillColor:col,fillOpacity:opts.fill!=null?opts.fill:.45})
        .bindPopup(popupHtml(m)).addTo(map);
      return ll;
    }
    if(m.cen&&m.cen.length>=2 && isFinite(m.cen[0]) && isFinite(m.cen[1])){
      const c=[m.cen[0],m.cen[1]];
      L.circleMarker(c,{radius:6,color:col,weight:2,fillColor:col,fillOpacity:.6,dashArray:'2 2'})
        .bindPopup(popupHtml(m)+'<br><span style="color:#a33">▲ sin polígono en catastro</span>').addTo(map);
      return [c];
    }
    return [];
  }

  // mapa 1: todas las caducas
  const map=L.map('mapa',{scrollWheelZoom:false}).setView([-31.0,-69.3],7);
  baseTiles(map);
  let pts=[];
  D.caducas_geo.forEach(m=>{ pts=pts.concat(dibujar(map,m,colorEdad(m.fecha_caducidad),{weight:1,fill:.4})); });
  if(pts.length) map.fitBounds(pts,{padding:[30,30]});

  // mapa 2: las pedibles hoy (destacadas en verde-oportunidad)
  const mapP=L.map('mapaPed',{scrollWheelZoom:false}).setView([-31.0,-69.3],7);
  baseTiles(mapP);
  let ptsP=[];
  D.pedibles_geo.forEach(m=>{ ptsP=ptsP.concat(dibujar(mapP,m,'#34d399',{weight:2,fill:.5})); });
  if(ptsP.length) mapP.fitBounds(ptsP,{padding:[40,40],maxZoom:11});
})();
</script>
